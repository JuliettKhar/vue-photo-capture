name: check job

on:
  pull_request:
    branches:
      - master
      - develop

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          clean: true
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Build dependencies
        run: npm run build

      - name: Test
        run: npm run test

      - name: Run AI code review
        uses: JuliettKhar/reviewer-lib@v3
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          exclude: tsconfig.json

      - name: Clean up
        run: |
          rm -rf node_modules
          rm -rf package-lock.json
          rm -rf dist
